name: source-build

# 从 Frida 源码构建 server + injector（arm64）。
# 手动触发时可选 compat / stealth：
#   compat  -> D-Bus 保留 re.frida.*，官方 frida-tools 可直连
#   stealth -> D-Bus 改为 app.svc.*，PC 需配套 client wheel
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'D-Bus mode: compat or stealth'
        required: true
        default: 'compat'
        type: choice
        options: [compat, stealth]
      frida_ref:
        description: 'Frida tag/ref (default: 17.19.0)'
        required: false
        default: '17.19.0'
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build.yml'
      - 'patches/**'
      - 'tools/**'

env:
  ANDROID_NDK_VERSION: r29
  FRIDA_VERSION: '17.19.0'

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl xz-utils ca-certificates \
            openjdk-17-jdk-headless unzip python3
          java -version

      - name: Set up Android NDK r29
        run: |
          cd "$RUNNER_TEMP"
          curl -fL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip"
          unzip -q ndk.zip
          echo "ANDROID_NDK_ROOT=$RUNNER_TEMP/android-ndk-${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Clone Frida ${{ github.event.inputs.frida_ref || env.FRIDA_VERSION }}
        run: |
          set -e
          REF="${{ github.event.inputs.frida_ref }}"
          [ -n "$REF" ] || REF="$FRIDA_VERSION"
          git clone --recurse-submodules --depth 1 --branch "$REF" https://github.com/frida/frida.git frida
          git -C frida submodule update --init --recursive --depth 1

      - name: Apply source patches
        run: python3 tools/apply_patches.py

      - name: Select D-Bus mode
        run: python3 tools/dbus_mode.py --mode "${{ github.event.inputs.mode || 'compat' }}"

      - name: Rebuild helper.dex (MIUI systemMain fallback)
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fL -o platform.zip "https://dl.google.com/android/repository/platform-35_r02.zip"
          unzip -q platform.zip
          cd "$GITHUB_WORKSPACE"
          python3 tools/build_helper_dex.py \
            --frida frida \
            --android-jar "$RUNNER_TEMP/android-35/android.jar" \
            --tooldir "$RUNNER_TEMP/toolchain"

      - name: Rebuild zymbiote stubs
        run: python3 tools/build_zymbiote.py

      - name: Configure android-arm64
        working-directory: frida
        run: ./configure --host=android-arm64

      - name: Build frida-server and frida-inject
        working-directory: frida
        run: |
          set -e
          ninja -C build subprojects/frida-core/server/frida-server
          ninja -C build subprojects/frida-core/inject/frida-inject

      - name: Collect + verify
        run: |
          set -e
          MODE="${{ github.event.inputs.mode || 'compat' }}"
          cp frida/build/subprojects/frida-core/server/frida-server "frida-server-17.19.0-android-arm64-$MODE"
          cp frida/build/subprojects/frida-core/inject/frida-inject "frida-inject-17.19.0-android-arm64-$MODE"
          file frida-server-* frida-inject-*
          for f in frida-server-* frida-inject-*; do
            echo "== $f"
            for bad in 27042 gum-js-loop frida:rpc frida-zymbiote; do
              if strings "$f" | grep -q "$bad"; then echo "::error::$f still contains $bad"; exit 1; fi
            done
            if [ "$MODE" = "stealth" ] && strings "$f" | grep -q 're\.frida'; then
              echo "::error::$f still contains re.frida"; exit 1
            fi
            if [ "$MODE" = "compat" ] && strings "$f" | grep -q 'app\.svc\.HostSession'; then
              echo "::error::$f still contains app.svc D-Bus"; exit 1
            fi
          done
          strings frida-server-* | grep -q 're.frida.HostSession17' || echo "note: compat host session marker not found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frida-17.19.0-android-arm64-${{ github.event.inputs.mode || 'compat' }}
          path: |
            frida-server-17.19.0-android-arm64-*
            frida-inject-17.19.0-android-arm64-*
          if-no-files-found: error
