name: anti-detect-frida-build

# 保底构建路径：在 4 核 / 16GB 的 GitHub Runner 上全量编译 frida-server，
# 产物可直接下载使用。本仓库只含补丁与工具（tools/、patches/），
# 运行时现场拉取 frida 源码再打补丁构建。
on:
  workflow_dispatch: {}          # 手动触发（推荐）
  # push:
  #   branches: [ main ]          # 按需放开

jobs:
  build-android:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - { label: arm64, target: arm64 }
          - { label: arm,   target: arm   }
          - { label: x86,   target: x86   }
    steps:
      - name: 签出补丁仓库（含 tools/）
        uses: actions/checkout@v4
      - name: 拉取 Frida 源码与全部子模块到 ./frida
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/frida/frida.git frida
          git -C frida submodule update --init --recursive --depth 1
      - name: 应用 anti-detection 补丁（幂等）
        run: python3 tools/apply_mods.py
      - name: 构建 frida-server (android-${{ matrix.label }})
        run: make -j"$(nproc)" "core-linux-android-${{ matrix.target }}"
        working-directory: frida
      - name: 构建 frida-inject (android-arm64)
        if: matrix.label == 'arm64'
        run: make -j"$(nproc)" frida-inject
        working-directory: frida
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-android-${{ matrix.label }}
          path: frida/build/**/frida-server*
          if-no-files-found: error
      - name: 上传 frida-inject
        if: matrix.label == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: frida-inject-android-arm64
          path: frida/build/**/frida-inject*
          if-no-files-found: error

  build-linux-native:
    runs-on: ubuntu-22.04
    steps:
      - name: 签出补丁仓库（含 tools/）
        uses: actions/checkout@v4
      - name: 拉取 Frida 源码与全部子模块到 ./frida
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/frida/frida.git frida
          git -C frida submodule update --init --recursive --depth 1
      - name: 应用 anti-detection 补丁（幂等）
        run: python3 tools/apply_mods.py
      - name: 构建 frida-server (linux-x86_64)
        run: make -j"$(nproc)" core-linux-x86_64
        working-directory: frida
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-linux-x86_64
          path: frida/build/**/frida-server*
          if-no-files-found: error