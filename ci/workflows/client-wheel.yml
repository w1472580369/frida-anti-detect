name: build-client-wheel

# 配套客户端出包：把 subprojects/frida-python 与服务端同源重编，
# 产出可直接 pip install 的 abi3 wheel（一个包覆盖 CPython 3.7~3.13）。
#
# 说明：
#   - 服务端已把 D-Bus 接口改成 app.svc.*、RPC 标记改成 app:rpc，
#     官方 PyPI 的 frida 客户端连不上，必须用这里产出的 wheel。
#   - Linux / macOS 在 Runner 上可直接出包；Windows 需要 MSVC 环境
#     （Developer Command Prompt + Windows SDK），建议本机跑
#     `bash client-build/build_client.sh windows-x86_64`，本工作流未覆盖。
on:
  workflow_dispatch:
    inputs:
      host:
        description: '目标平台，留空 = 全部（linux-x86_64 / macos-arm64）'
        required: false
        default: ''

jobs:
  wheel:
    name: wheel-${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, host: linux-x86_64 }
          - { os: macos-14,     host: macos-arm64  }
    steps:
      - name: 签出仓库（含已打补丁的 frida 源码树）
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装打包依赖
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install setuptools wheel

      - name: 校验源码树已打补丁
        run: |
          grep -q 'app\.svc\.HostSession17' frida/subprojects/frida-core/lib/base/session.vala \
            || { echo "源码树未打补丁，先跑 tools/apply_mods.py"; exit 1; }

      - name: 构建 wheel + server
        env:
          FRIDA_SRC: ${{ github.workspace }}/frida
          JOBS: 4
        run: |
          chmod +x client-build/build_client.sh
          bash client-build/build_client.sh ${{ matrix.host }}

      - name: 端到端自测（仅 linux，可真实起 server）
        if: matrix.host == 'linux-x86_64'
        run: |
          python3 -m pip install --force-reinstall dist/frida-*.whl
          python3 client-build/verify_client.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: frida-client-${{ matrix.host }}
          path: |
            dist/*.whl
            dist/frida-server-*
          if-no-files-found: error
